name: Сборка APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить зависимости
        run: npm install

      - name: Создать Android-проект
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Настроить экран (горизонтально, без засыпания)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"/' "$MANIFEST"
          cat "$MANIFEST"

      - name: Иконка приложения
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
              if [ -f "android/app/src/main/res/mipmap-$d/$f" ]; then
                cp assets/icon-512.png "android/app/src/main/res/mipmap-$d/$f"
              fi
            done
          done

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Переименовать
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MoyZhivoyAkvarium.apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: MoyZhivoyAkvarium-apk
          path: MoyZhivoyAkvarium.apk
